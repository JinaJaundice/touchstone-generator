<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Touchstone generator: synthetic bank transactions with labelled financial crime</title>
    <meta
      name="description"
      content="The Touchstone generator makes the transactions of a synthetic UK bank with laundering, fraud and crypto patterns planted inside, every planted transaction labelled."
    />
    <meta name="theme-color" content="#f3eee4" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 34'%3E%3Crect x='1' y='1' width='26' height='32' rx='3' fill='%23141416'/%3E%3Cpath d='M7 25.5 C10.5 20.5, 15.5 14, 21.5 8 L23 9.5 C17.5 15, 12.5 21, 9 26.5 Z' fill='%23e0b649'/%3E%3C/svg%3E"
    />
    <script>
      /* resolve the stored theme before first paint so a dark-theme user
         never sees a light flash; mirrors src/lib/theme.ts, keep in step */
      (function () {
        try {
          var t = localStorage.getItem("touchstone-theme");
          var dark = t === "dark" || (t !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.setAttribute("data-theme", "dark");
        } catch (e) { /* default light */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/generator/main.tsx"></script>
  </body>
</html>
